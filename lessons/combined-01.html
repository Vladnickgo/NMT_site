<head>

    <link rel="stylesheet" href="../style.css">
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo"><img src="../assets/images/logo.svg" alt="Optima Academy"></a>
            <p class="tagline">Підготовка до НМТ з математики</p>
        </div>
    </header>

    <main class="container lesson-page">
        <div class="lesson-header">
            <p class="breadcrumb">
                <a href="../index.html">Головна</a> ›
                <a href="../index.html#combined">🎯 Комбіновані тести НМТ</a> ›
                Урок 01
            </p>
            <h1>Вхідне діагностування</h1>
        </div>

        <article>
            <div id="calculator">
                
            </div>
        </article>

        <nav class="lesson-nav">
            <span class="disabled">← Попередній</span>
            <a href="combined-02.html">Робота над комплексним завданням →</a>
        </nav>
    </main>


    <script src="../script.js"></script>
    <script>
        var elt = document.getElementById('calculator');
        var calculator = Desmos.GraphingCalculator(elt);

        // 1. Задаем саму функцию
        calculator.setExpression({ id: 'graph1', latex: 'y = x^2 - a' });

        // 2. Явно задаем слайдер для параметра a с границами
        calculator.setExpression({ id: 'sliderA', latex: 'a = 1', sliderBounds: { min: -5, max: 5, step: 0.5 } });
    </script>

    <footer class="site-footer">
        <div class="container">
